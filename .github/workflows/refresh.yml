# Keeps the site's caches warm so pages load fast.
#
# Vercel's Hobby plan allows one cron a day, so the ten-minute schedule runs
# here instead. GitHub Actions cron is free on public and private repos.
name: Refresh

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # The list is checked against the site's own routes by
      # `npm run routes:check`, which warns when a desk has been added and not
      # added here — which is how the gaming desk shipped cold.
      - name: Warm every desk
        run: |
          BASE="${{ vars.SITE_URL || 'https://feed-theta-ten.vercel.app' }}"
          for path in "" technology photography sport ai hardware robotics vehicles cameras lenses technique f1 golf ufc science gaming weather screen wire ai/archive hardware/archive robotics/archive vehicles/archive cameras/archive lenses/archive technique/archive f1/archive golf/archive ufc/archive science/archive gaming/archive weather/archive screen/archive wire/archive ai/map ai/models f1/calendar f1/standings f1/weekend golf/majors golf/season golf/this-week ufc/cards ufc/next science/launches weather/articles weather/climate games gear model rumours; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BASE/$path")
            echo "$code  /$path"
          done

      # The stories the front page is actually pointing at.
      #
      # A story page is cacheable and always has been, and nothing had ever
      # warmed one. On a site this quiet the reader is almost always the first
      # visitor to a given story, so clicking a headline on the front page paid
      # the whole cold render — forty feeds, and where the publisher syndicates
      # only a teaser, a live fetch and parse of the article. Three to five
      # seconds, measured on five of the first six links on the page.
      #
      # Taken from the front page itself rather than from a list, because which
      # stories it leads on is exactly what changes every cycle. They hold for
      # an hour now, so most of these are already warm and cost a HIT.
      - name: Warm what the front page links to
        run: |
          BASE="${{ vars.SITE_URL || 'https://feed-theta-ten.vercel.app' }}"
          curl -s --max-time 60 "$BASE/" \
            | grep -o '"/story/[a-z0-9-]*"' | tr -d '"' | sort -u | head -30 \
            | while read -r path; do
                code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BASE$path")
                echo "$code  $path"
              done
