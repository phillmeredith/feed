# Appends a day's observations to the series store and commits them.
#
# The series exist to be long, not to be current, so this runs once a day and
# is idempotent — a re-run after a failure records nothing twice.
name: Update stores

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run series:record

      # Reference stores are rebuilt on the same schedule, so entity pages
      # never have to fetch anything during a request.
      - run: npm run catalogue:update
      - run: npm run f1:update
      - run: npm run golf:update
      - run: npm run ufc:update

      # Video last: it reads the three stores above to know what to look for,
      # so a race or a card recorded this morning gets its highlights in the
      # same run rather than tomorrow's. It searches YouTube one session at a
      # time and a failure there shouldn't lose the results already gathered.
      - run: npm run highlights:update
        continue-on-error: true
      - run: npm run videos:update
        continue-on-error: true

      - name: Commit the day's observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series data/model-catalogue.json data/f1.json \
            data/golf.json data/ufc.json data/highlights.json data/videos.json
          if git diff --staged --quiet; then
            echo "nothing new to record"
          else
            git commit -m "Update stores for $(date -u +%Y-%m-%d)"
            git push
          fi
